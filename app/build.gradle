apply plugin: 'com.android.application'

android {
    namespace 'com.ngoc.breathtimer'
    compileSdk 34

    defaultConfig {
        applicationId "com.ngoc.breathtimer"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
